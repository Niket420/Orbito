[project]
name = "orbito-backend"
version = "0.1.0"
description = "Local AI backend for the Orbito voice-controlled macOS assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Cactus Whistle speech-to-text (local, on-device). Without it the backend
# falls back to a clearly labelled mock transcriber.
speech = ["cactus-needle>=3.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
